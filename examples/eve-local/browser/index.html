<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eve browser fixture</title>
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    input { width: min(100%, 38rem); box-sizing: border-box; font: inherit; }
    button { font: inherit; margin: 0.5rem 0.3rem 0 0; }
    li { overflow-wrap: anywhere; }
  </style>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <h1>Eve browser fixture</h1>
    <p>Enter a synthetic fixture token. Start a session or enter an existing session ID you own.</p>
    <label for="token">Fixture token</label>
    <input id="token" type="password" autocomplete="off" maxlength="128">
    <label for="session">Session ID</label>
    <input id="session" autocomplete="off" maxlength="160" spellcheck="false">
    <div>
      <button id="new" type="button">New session</button>
      <button id="connect" type="button">Attach or reconnect</button>
      <button id="disconnect" type="button" disabled>Disconnect stream</button>
    </div>
    <p id="status" role="status">Disconnected.</p>
    <p id="cursor">Cursor: —</p>
    <form id="message-form">
      <label for="message">Message</label>
      <input id="message" placeholder="total [4,0,9] or wait" maxlength="512" autocomplete="off" required>
      <button id="send" disabled>Send</button>
      <button id="cancel" type="button" disabled>Cancel server turn</button>
    </form>
    <h2>Conversation</h2>
    <ol id="transcript" aria-label="Conversation" aria-live="polite"></ol>
  </main>
</body>
</html>
